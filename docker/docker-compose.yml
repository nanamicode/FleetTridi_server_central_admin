services:
  fleettridi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./fleettridi-data:/app/data
    environment:
      FLEETTRIDI_URLS: http://0.0.0.0:8787
      FLEETTRIDI_PUBLIC_URL: ${FLEETTRIDI_PUBLIC_URL:?configure a URL publica HTTPS}
      FLEETTRIDI_ADMIN_USER: ${FLEETTRIDI_ADMIN_USER:-nanamicode}
      FLEETTRIDI_ADMIN_PASSWORD: ${FLEETTRIDI_ADMIN_PASSWORD:?defina uma senha administrativa forte}
      FLEETTRIDI_ADMIN_TOKEN: ${FLEETTRIDI_ADMIN_TOKEN:-}

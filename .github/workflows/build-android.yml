name: build-android
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build DEBUG agent for physical testing
        working-directory: android-agent
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FleetTridi-Agent-DEBUG-TESTE
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Decode production signing keystore
        if: ${{ secrets.FLEETTRIDI_KEYSTORE_B64 != '' && secrets.FLEETTRIDI_KEYSTORE_PASSWORD != '' && secrets.FLEETTRIDI_KEY_ALIAS != '' && secrets.FLEETTRIDI_KEY_PASSWORD != '' }}
        working-directory: android-agent
        env:
          KEYSTORE_B64: ${{ secrets.FLEETTRIDI_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > fleettridi-release.jks

      - name: Build unsigned RELEASE agent
        if: ${{ secrets.FLEETTRIDI_KEYSTORE_B64 != '' && secrets.FLEETTRIDI_KEYSTORE_PASSWORD != '' && secrets.FLEETTRIDI_KEY_ALIAS != '' && secrets.FLEETTRIDI_KEY_PASSWORD != '' }}
        working-directory: android-agent
        run: gradle assembleRelease

      - name: Sign RELEASE agent
        if: ${{ secrets.FLEETTRIDI_KEYSTORE_B64 != '' && secrets.FLEETTRIDI_KEYSTORE_PASSWORD != '' && secrets.FLEETTRIDI_KEY_ALIAS != '' && secrets.FLEETTRIDI_KEY_PASSWORD != '' }}
        working-directory: android-agent
        env:
          FLEETTRIDI_KEYSTORE_PASSWORD: ${{ secrets.FLEETTRIDI_KEYSTORE_PASSWORD }}
          FLEETTRIDI_KEY_ALIAS: ${{ secrets.FLEETTRIDI_KEY_ALIAS }}
          FLEETTRIDI_KEY_PASSWORD: ${{ secrets.FLEETTRIDI_KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign             --ks fleettridi-release.jks             --ks-key-alias "$FLEETTRIDI_KEY_ALIAS"             --ks-pass env:FLEETTRIDI_KEYSTORE_PASSWORD             --key-pass env:FLEETTRIDI_KEY_PASSWORD             --out app/build/outputs/apk/release/FleetTridi-Agent-release.apk             app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/FleetTridi-Agent-release.apk

      - uses: actions/upload-artifact@v4
        if: ${{ secrets.FLEETTRIDI_KEYSTORE_B64 != '' && secrets.FLEETTRIDI_KEYSTORE_PASSWORD != '' && secrets.FLEETTRIDI_KEY_ALIAS != '' && secrets.FLEETTRIDI_KEY_PASSWORD != '' }}
        with:
          name: FleetTridi-Agent-RELEASE-ASSINADO
          path: android-agent/app/build/outputs/apk/release/FleetTridi-Agent-release.apk
          retention-days: 30

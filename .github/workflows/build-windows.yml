name: build-windows
on:
  push:
    branches: [ main, fleet-v0.4-rollouts ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish FleetTridi Windows
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Bundle official Android platform-tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath dist/FleetTridi-Windows -Force
      - name: Add quick start
        shell: pwsh
        run: |
          Copy-Item scripts/INICIAR-TESTE-LOCAL.cmd dist/FleetTridi-Windows/INICIAR-TESTE-LOCAL.bat
          @"
FleetTridi v0.4.1

PRIMEIRO TESTE:
1. Execute INICIAR-TESTE-LOCAL.bat.
2. No Admin use http://localhost:8787.
3. Usuario: nanamicode
4. Senha: fleettridi-local
5. Clique Detectar IP LAN antes do Bootstrap.
6. Se o Firewall perguntar, permita somente em redes privadas.

Produção: configure FLEETTRIDI_ADMIN_PASSWORD e HTTPS.
"@ | Set-Content -Encoding UTF8 dist/FleetTridi-Windows/LEIA-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FleetTridi-Windows
          path: dist/FleetTridi-Windows/**

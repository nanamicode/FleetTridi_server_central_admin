name: build-windows
on:
  push:
    branches: [ main, fleet-v0.4-rollouts ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish FleetTridi Windows
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Bundle official Android platform-tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath dist/FleetTridi-Windows -Force
      - name: Add quick start
        shell: pwsh
        run: |
          "Configure FLEETTRIDI_ADMIN_PASSWORD antes de expor o servidor. Para teste local use FLEETTRIDI_DEV_MODE=1 e senha fleettridi-local." | Set-Content -Encoding UTF8 dist/FleetTridi-Windows/LEIA-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FleetTridi-Windows
          path: dist/FleetTridi-Windows/**

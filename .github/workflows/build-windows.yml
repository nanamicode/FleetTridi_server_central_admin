name: build-windows
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android test agent for all-in-one package
        working-directory: android-agent
        run: gradle assembleDebug

      - name: Publish FleetTridi Windows
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Bundle FleetTridi Android test agent
        shell: pwsh
        run: |
          Copy-Item android-agent/app/build/outputs/apk/debug/app-debug.apk dist/FleetTridi-Windows/FleetTridi-Agent-DEBUG-TESTE.apk -Force
          Copy-Item android-agent/app/build/outputs/apk/debug/app-debug.apk dist/FleetTridi-Windows/FleetTridi-Agent.apk -Force

      - name: Bundle official Android platform-tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath dist/FleetTridi-Windows -Force

      - name: Add local fallback launcher
        shell: pwsh
        run: |
          Copy-Item scripts/INICIAR-TESTE-LOCAL.cmd dist/FleetTridi-Windows/INICIAR-TESTE-LOCAL.bat -Force

      - name: Add quick start
        shell: pwsh
        run: |
          $lines = @(
            "FLEETTRIDI v0.5.1 - PRIMEIRO TESTE",
            "",
            "1. Abra FleetTridi.Central.exe.",
            "2. O servidor abre no PC e escuta tambem na rede local.",
            "3. O login e automatico com uma senha aleatoria de sessao.",
            "4. No Admin confirme o campo URL vista pelos totens.",
            "5. Conecte a TV box por USB, com depuracao USB habilitada.",
            "6. Cadastre o totem; deixe ADB inicial vazio para autodetectar um unico USB.",
            "7. Clique Bootstrap via ADB e escolha FleetTridi-Agent.apk.",
            "8. O bootstrap so conclui quando o proprio agente volta online e reporta su-root.",
            "",
            "FleetTridi-Agent.apk deste pacote e DEBUG e serve para o primeiro teste fisico.",
            "Para producao use um Agent RELEASE assinado sempre com a mesma chave.",
            "",
            "Se o Windows Firewall perguntar, permita acesso somente em redes privadas.",
            "Nao exponha ADB/5555 na Internet."
          )
          $lines | Set-Content -Encoding UTF8 dist/FleetTridi-Windows/LEIA-ME.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FleetTridi-Windows
          path: dist/FleetTridi-Windows/**
          retention-days: 14
